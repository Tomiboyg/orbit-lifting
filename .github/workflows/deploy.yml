name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The anon key is public by design (security comes from RLS, spec 12.3).
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # npm caching needs a lockfile, which doesn't exist on the very first
          # run only — the conditional disables caching until it is committed.
          cache: ${{ hashFiles('package-lock.json') == '' ? '' : 'npm' }}

      # One-time bootstrap: this project is built without a local Node install,
      # so the lockfile is generated and committed by CI itself. After this
      # first run, package-lock.json lives in the repo and every future run
      # installs from it (npm ci = fully reproducible builds).
      - name: Generate + commit package-lock.json (first run only)
        if: ${{ hashFiles('package-lock.json') == '' }}
        run: |
          npm install --package-lock-only
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add package-lock.json [skip ci]"
          git push

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Type check + build
        run: npm run build
        env:
          # Serve the app under /<repo-name>/ on GitHub Pages.
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: E2E smoke tests (Playwright)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --project=desktop
        continue-on-error: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
