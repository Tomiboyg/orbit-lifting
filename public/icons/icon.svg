<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.65" y2="1">
      <stop offset="0" stop-color="#141631"/>
      <stop offset="1" stop-color="#0a0b1a"/>
    </linearGradient>
    <radialGradient id="planet" cx="0.38" cy="0.28" r="1.05">
      <stop offset="0" stop-color="#ced3fb"/>
      <stop offset="0.55" stop-color="#aab2f4"/>
      <stop offset="1" stop-color="#8d95ea"/>
    </radialGradient>
    <!-- gradient in the rotated ring's user space: white sheen at the
         bottom-left of the front strand fading to periwinkle top-right -->
    <linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="85" y1="307" x2="415" y2="183">
      <stop offset="0" stop-color="#eceefc"/>
      <stop offset="0.42" stop-color="#aab1f4"/>
      <stop offset="1" stop-color="#8b93e8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <!-- ring: back strand (drawn first, disappears behind the planet) -->
  <g transform="rotate(-24 250 245)">
    <ellipse cx="250" cy="245" rx="165" ry="62" fill="none" stroke="url(#ring)" stroke-width="15"/>
  </g>
  <!-- planet -->
  <circle cx="250" cy="245" r="108" fill="url(#planet)"/>
  <!-- surface bands -->
  <circle cx="250" cy="245" r="68" fill="none" stroke="#8e96da" stroke-opacity="0.7" stroke-width="11"/>
  <circle cx="250" cy="245" r="47" fill="none" stroke="#9aa2e3" stroke-opacity="0.6" stroke-width="9"/>
  <!-- core -->
  <circle cx="250" cy="245" r="30" fill="#4a54c6"/>
  <!-- top-left sheen -->
  <path d="M 199.7 218.2 A 57 57 0 0 1 224.1 194.2" fill="none" stroke="#eceefc" stroke-width="7" stroke-linecap="round"/>
  <!-- ring: front strand crossing over the planet -->
  <g transform="rotate(-24 250 245)">
    <path d="M 85 245 A 165 62 0 0 0 415 245" fill="none" stroke="url(#ring)" stroke-width="15" stroke-linecap="round"/>
  </g>
  <!-- moon riding the ring -->
  <circle cx="400" cy="178" r="13" fill="#ffffff" stroke="#262b52" stroke-width="5"/>
</svg>
